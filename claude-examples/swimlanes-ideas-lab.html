<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSGraphRender — swimlanes idea lab</title>
<style>
  :root{
    --bg:#070B14; --panel:rgba(12,19,34,.86); --line:#1C2A42;
    --ink:#E8EEF7; --dim:#8FA0B8; --cyan:#52D8FF; --amber:#FFB454; --violet:#9D8CFF; --gray:#8FA0B8;
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink);
    font:14px/1.45 "Segoe UI", system-ui, sans-serif; overflow:hidden}
  #bar{position:fixed; top:0; left:0; right:0; z-index:9; display:flex; gap:8px;
    align-items:center; padding:12px 16px; background:var(--panel);
    border-bottom:1px solid var(--line); backdrop-filter:blur(10px)}
  #bar .t{font-weight:600; margin-right:10px}
  #bar .sub{color:var(--dim); font-size:12.5px; margin-left:auto}
  .tab{border:1px solid var(--line); background:rgba(20,30,50,.5); color:var(--ink);
    border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer}
  .tab[aria-pressed="true"]{border-color:var(--cyan); background:rgba(82,216,255,.12); color:#CFF3FF}
  .tab b{color:var(--cyan); margin-right:6px}
  .tab:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
  .pane{position:fixed; inset:56px 0 0 0; display:none}
  .pane.on{display:block}
  .pane svg{width:100%; height:100%}
  .words{position:fixed; left:50%; bottom:16px; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:9px 16px; color:var(--dim); font-size:12.5px; z-index:8; max-width:760px; text-align:center}
  .words b{color:var(--cyan)}
</style>
</head>
<body>
<div id="bar" role="tablist" aria-label="Swimlane variants">
  <span class="t">Swimlanes idea lab</span>
  <button class="tab" data-p="h1" aria-pressed="true"><b>H1</b>Kind lanes</button>
  <button class="tab" data-p="h2" aria-pressed="false"><b>H2</b>Pipeline columns</button>
  <button class="tab" data-p="h3" aria-pressed="false"><b>H3</b>Depth ribbons</button>
  <button class="tab" data-p="h4" aria-pressed="false"><b>H4</b>Subway map</button>
  <span class="sub">H = rows and columns that group items; arrows cross between them.</span>
</div>

<section class="pane on" id="h1"></section>
<section class="pane" id="h2"></section>
<section class="pane" id="h3"></section>
<section class="pane" id="h4"></section>

<div class="words" id="words"></div>

<script>
(function(){
"use strict";
var C = {pub:"#52D8FF", priv:"#9D8CFF", con:"#FFB454", doc:"#8FA0B8"};
var NS = "http://www.w3.org/2000/svg";
var WORDS = {
  h1:'<b>H1 — Kind lanes.</b> One glowing row per kind: public API on top, private machinery under it, contracts, then docs. Arrows dip between lanes, so “who reaches across a boundary” is the first thing you see.',
  h2:'<b>H2 — Pipeline columns.</b> Left to right in call order: entry points, then checks, then config, then output. Reads like a sentence — what happens first stands first.',
  h3:'<b>H3 — Depth ribbons.</b> Lanes by dependency depth: things nothing depends on sink to the bottom, callers stack above. Wide soft ribbons carry the traffic between levels.',
  h4:'<b>H4 — Subway map.</b> Each call chain is a colored line with stations. Where chains share a function, the lines share a station. Least literal, most memorable.'
};

function el(tag, attrs, parent){
  var e=document.createElementNS(NS,tag);
  for(var k in attrs){ e.setAttribute(k, attrs[k]); }
  if(parent){ parent.appendChild(e); }
  return e;
}
function box(svg, x, y, w, color, label, glow){
  var g=el("g",{},svg);
  el("rect",{x:x-w/2,y:y-17,width:w,height:34,rx:9,
    fill:"rgba(16,26,45,.94)",stroke:color,"stroke-width":glow?2:1.3,
    filter:glow?"url(#glow)":""},g);
  var t=el("text",{x:x,y:y+4,"text-anchor":"middle",fill:"#E8EEF7",
    "font-size":"12","font-family":"Segoe UI, system-ui, sans-serif"},g);
  t.textContent=label;
  return {x:x,y:y,w:w};
}
function edge(svg, a, b, color, width){
  el("path",{d:"M"+a.x+","+(a.y+17)+" C"+a.x+","+((a.y+b.y)/2)+" "+b.x+","+((a.y+b.y)/2)+" "+b.x+","+(b.y-17),
    fill:"none", stroke:color||"#2E4160","stroke-width":width||1.5, opacity:.8,
    "marker-end":"url(#arr)"},svg);
}
function defs(svg){
  var d=el("defs",{},svg);
  d.innerHTML='<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A506E"/></marker>'+
  '<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#52D8FF" flood-opacity="0.5"/></filter>'+
  '<linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52D8FF" stop-opacity=".22"/><stop offset="1" stop-color="#52D8FF" stop-opacity=".02"/></linearGradient>';
}
function lane(svg, y, h, W, color, label){
  el("rect",{x:0,y:y,width:W,height:h,fill:color,opacity:.05},svg);
  el("line",{x1:0,y1:y,x2:W,y2:y,stroke:color,opacity:.35,"stroke-width":1},svg);
  var t=el("text",{x:18,y:y+24,fill:color,"font-size":"12.5",opacity:.9,
    "font-family":"Segoe UI, system-ui, sans-serif","font-weight":"600"},svg);
  t.textContent=label;
}

function buildH1(svg,W,H){
  defs(svg);
  var rows=[["Public API",C.pub,.10],["Private machinery",C.priv,.34],["Contracts",C.con,.62],["Documents",C.doc,.82]];
  rows.forEach(function(r,i){
    var y=r[2]*H, h=(i<rows.length-1? rows[i+1][2]*H : H)-y;
    lane(svg,y,h,W,r[1],r[0]);
  });
  var n={};
  n.newdoc=box(svg,.24*W,.21*H,C.pub,"New-RenderDocument",true);
  n.show  =box(svg,.55*W,.21*H,C.pub,"Show-RenderDocument");
  n.gets  =box(svg,.78*W,.21*H,C.pub,"Get-RenderTemplateSet");
  n.cfg   =box(svg,.16*W,.47*H,C.priv,"Resolve-RenderConfiguration");
  n.test  =box(svg,.42*W,.47*H,C.priv,"Test-RenderViewModel");
  n.hash  =box(svg,.63*W,.47*H,C.priv,"Get-HashtableValue");
  n.path  =box(svg,.84*W,.47*H,C.priv,"Resolve-…SetPath");
  n.schema=box(svg,.34*W,.71*H,C.con,"viewmodel.schema.json");
  n.tset  =box(svg,.72*W,.71*H,C.con,"templateset.psd1");
  n.hand  =box(svg,.55*W,.90*H,C.doc,"HANDOFF.md");
  edge(svg,n.newdoc,n.cfg); edge(svg,n.newdoc,n.test);
  edge(svg,n.show,n.hand,C.doc); edge(svg,n.gets,n.path); edge(svg,n.gets,n.tset,C.con);
  edge(svg,n.cfg,n.hash); edge(svg,n.test,n.schema,C.con); edge(svg,n.cfg,n.schema,C.con);
}
function buildH2(svg,W,H){
  defs(svg);
  var cols=[["Entry",C.pub,.06],["Checks",C.priv,.30],["Config & templates",C.violet? C.priv:C.priv,.54],["Output",C.con,.78]];
  cols.forEach(function(c,i){
    var x=c[2]*W, w=(i<cols.length-1? cols[i+1][2]*W : W)-x;
    el("rect",{x:x,y:0,width:w,height:H,fill:c[1],opacity:.045},svg);
    el("line",{x1:x,y1:0,x2:x,y2:H,stroke:c[1],opacity:.3},svg);
    var t=el("text",{x:x+16,y:30,fill:c[1],"font-size":"12.5","font-weight":"600",
      "font-family":"Segoe UI, system-ui, sans-serif"},svg);
    t.textContent=c[0];
  });
  function hedge(a,b,color){ el("path",{d:"M"+(a.x+a.w/2)+","+a.y+" C"+((a.x+b.x)/2)+","+a.y+" "+((a.x+b.x)/2)+","+b.y+" "+(b.x-b.w/2-6)+","+b.y,
    fill:"none",stroke:color||"#2E4160","stroke-width":1.6,opacity:.85,"marker-end":"url(#arr)"},svg); }
  var a1=box(svg,.16*W,.30*H,C.pub,"New-RenderDocument",true);
  var a2=box(svg,.16*W,.62*H,C.pub,"Show-RenderDocument");
  var b1=box(svg,.41*W,.20*H,C.priv,"Assert-…ContractVersion");
  var b2=box(svg,.41*W,.42*H,C.priv,"Test-RenderViewModel");
  var b3=box(svg,.41*W,.64*H,C.priv,"Resolve-RenderConfiguration");
  var c1=box(svg,.655*W,.32*H,C.con,"viewmodel.schema.json");
  var c2=box(svg,.655*W,.56*H,C.con,"templateset.psd1");
  var c3=box(svg,.655*W,.78*H,C.priv,"Expand-RenderSlots");
  var d1=box(svg,.89*W,.45*H,C.pub,"report.html",true);
  hedge(a1,b1); hedge(a1,b2); hedge(a1,b3); hedge(a2,a1,C.pub);
  hedge(b1,c1,C.con); hedge(b2,c1,C.con); hedge(b3,c2,C.con); hedge(b3,c3);
  hedge(c3,d1,C.cyan? C.pub:C.pub);
}
function buildH3(svg,W,H){
  defs(svg);
  var lanes=[["Depth 0 — entry points",.08],["Depth 1 — orchestration",.36],["Depth 2 — helpers",.62],["Depth 3 — leaves: contracts & docs",.84]];
  lanes.forEach(function(l,i){
    var y=l[1]*H, h=(i<lanes.length-1? lanes[i+1][1]*H : H)-y;
    lane(svg,y,h,W,"#52D8FF",l[0]);
  });
  el("path",{d:"M "+.22*W+","+.20*H+" C "+.22*W+","+.40*H+" "+.30*W+","+.40*H+" "+.34*W+","+.48*H+
     " L "+.50*W+","+.48*H+" C "+.42*W+","+.40*H+" "+.34*W+","+.36*H+" "+.30*W+","+.20*H+" Z",
     fill:"url(#ribbon)"},svg);
  el("path",{d:"M "+.44*W+","+.48*H+" C "+.44*W+","+.62*H+" "+.52*W+","+.62*H+" "+.55*W+","+.72*H+
     " L "+.70*W+","+.72*H+" C "+.62*W+","+.62*H+" "+.56*W+","+.58*H+" "+.52*W+","+.48*H+" Z",
     fill:"url(#ribbon)"},svg);
  var e1=box(svg,.26*W,.20*H,C.pub,"New-RenderDocument",true);
  var e2=box(svg,.62*W,.20*H,C.pub,"Show-RenderDocument");
  var o1=box(svg,.42*W,.48*H,C.priv,"Resolve-RenderConfiguration");
  var o2=box(svg,.68*W,.48*H,C.priv,"Get-RenderTemplateSet");
  var h1=box(svg,.34*W,.72*H,C.priv,"Get-HashtableValue");
  var h2=box(svg,.62*W,.72*H,C.priv,"Merge-RenderTheme");
  box(svg,.28*W,.93*H,C.con,"viewmodel.schema.json");
  box(svg,.56*W,.93*H,C.con,"templateset.psd1");
  box(svg,.82*W,.93*H,C.doc,"vendoring.md");
  edge(svg,e1,o1); edge(svg,e2,o2,C.pub); edge(svg,o1,h1); edge(svg,o1,h2);
}
function buildH4(svg,W,H){
  defs(svg);
  var routes=[
    {c:C.pub, y:.30, name:"Render line", stops:["New-RenderDocument","Resolve-RenderConfiguration","Expand-RenderSlots","report.html"]},
    {c:C.amber? C.con:C.con, y:.52, name:"Contract line", stops:["Assert-…Version","viewmodel.schema.json","Test-RenderViewModel"]},
    {c:C.priv, y:.74, name:"Template line", stops:["Get-RenderTemplateSet","templateset.psd1","Copy-RenderVendorFiles"]}
  ];
  routes.forEach(function(r){
    var y=r.y*H, x0=.10*W, x1=.90*W;
    el("path",{d:"M"+x0+","+y+" L"+x1+","+y, stroke:r.c,"stroke-width":6,
      "stroke-linecap":"round", opacity:.8},svg);
    var t=el("text",{x:x0,y:y-26,fill:r.c,"font-size":"13","font-weight":"600",
      "font-family":"Segoe UI, system-ui, sans-serif"},svg);
    t.textContent=r.name;
    r.stops.forEach(function(s,i){
      var x=x0+(x1-x0)*(i/(r.stops.length-1));
      el("circle",{cx:x,cy:y,r:9,fill:"#0B1322",stroke:r.c,"stroke-width":3},svg);
      var lbl=el("text",{x:x,y:y+30,"text-anchor":"middle",fill:"#C9D6E8",
        "font-size":"11.5","font-family":"Segoe UI, system-ui, sans-serif"},svg);
      lbl.textContent=s;
    });
  });
  /* an interchange: schema is on both middle lines */
  el("circle",{cx:.50*W, cy:.52*H, r:13, fill:"none", stroke:"#E8EEF7",
    "stroke-width":2, opacity:.7},svg);
  var note=el("text",{x:.50*W, y:.52*H-22,"text-anchor":"middle",fill:"#E8EEF7",
    "font-size":"11", opacity:.75,"font-family":"Segoe UI, system-ui, sans-serif"},svg);
  note.textContent="interchange — shared by two chains";
}

var BUILDERS={h1:buildH1,h2:buildH2,h3:buildH3,h4:buildH4};
function render(id){
  var pane=document.getElementById(id);
  pane.innerHTML="";
  var W=pane.clientWidth||1200, H=pane.clientHeight||660;
  var svg=el("svg",{viewBox:"0 0 "+W+" "+H});
  pane.appendChild(svg);
  BUILDERS[id](svg,W,H);
  document.getElementById("words").innerHTML=WORDS[id];
}
render("h1");
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){
    document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-pressed","false");});
    t.setAttribute("aria-pressed","true");
    document.querySelectorAll(".pane").forEach(function(p){p.classList.remove("on");});
    var id=t.dataset.p;
    document.getElementById(id).classList.add("on");
    render(id);
  });
});
window.addEventListener("resize", function(){
  var on=document.querySelector(".pane.on"); if(on){ render(on.id); }
});
})();
</script>
</body>
</html>
