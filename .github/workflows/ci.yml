name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.powershell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            powershell: pwsh
          # Windows PowerShell 5.1 is load-bearing: the manifest claims Desktop
          # compatibility and this leg is the only thing proving it.
          - os: windows-latest
            powershell: powershell
          - os: ubuntu-latest
            powershell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two build tasks shell out to node --check and neither skips when it is
      # missing, so this is not optional tooling. The version agrees with the
      # Tools floor in Requirements.psd1; tests/PreTag.Tests.ps1 asserts it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Keyed on Requirements.psd1, which is where the Playwright pin lives, so
      # changing the pin invalidates the browser cache with it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('Requirements.psd1') }}

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
            ~/Documents/WindowsPowerShell/Modules
          key: ${{ runner.os }}-${{ matrix.powershell }}-psmodules-${{ hashFiles('Requirements.psd1') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.powershell }}-psmodules-

      # Explicit, and before the default task rather than inside it. Nothing
      # downloads half a gigabyte of Chromium as a side effect of running a
      # build - the default task fails by name and points here instead.
      - name: Install the browser harness
        shell: ${{ matrix.powershell }} {0}
        run: ./build.ps1 -Task BootstrapBrowser

      # -Bootstrap installs any missing PowerShell module and then runs the
      # default task, so one invocation is enough. It does not install tools.
      - name: Bootstrap and test
        shell: ${{ matrix.powershell }} {0}
        run: ./build.ps1 -Bootstrap

      - name: Publish test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.powershell }}
          path: output/*.xml
          if-no-files-found: warn
