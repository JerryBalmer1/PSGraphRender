name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} / ${{ matrix.powershell }}${{ matrix.browser && ' + browser' || '' }})
    runs-on: ${{ matrix.os }}

    # The shell belongs HERE, not on the step. `matrix` is not a recognised
    # named-value in `jobs.<id>.steps.shell`, so `shell: ${{ matrix.powershell }}`
    # on a step made the whole file unparseable - which is why no job in this
    # repository ever started between v0.2.0 and v0.6.0. `pwsh` and `powershell`
    # are built-in shell names, so the custom `{0}` form is not needed either.
    defaults:
      run:
        shell: ${{ matrix.powershell }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            powershell: pwsh
            browser: false
          # Windows PowerShell 5.1 is load-bearing: the manifest claims Desktop
          # compatibility and this leg is the only thing proving it.
          - os: windows-latest
            powershell: powershell
            browser: false
          # THE BROWSER LEG, and one is a decision rather than a shortcut. What
          # a browser does with the page does not vary by which PowerShell
          # produced it, so installing half a gigabyte of Chromium three times
          # buys nothing. Ubuntu because it is the cheapest runner and the only
          # place `playwright install --with-deps` is a real question.
          #
          # The other two legs run `-Task WithoutBrowser`, which runs every
          # other gate and then says out loud that this one did not run. A leg
          # quietly missing a gate is the failure this repository has found
          # three times.
          - os: ubuntu-latest
            powershell: pwsh
            browser: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Two build tasks shell out to node --check and neither skips when it is
      # missing, so this is not optional tooling on any leg. The version agrees
      # with the Tools floor in Requirements.psd1; tests/PreTag.Tests.ps1
      # asserts it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Keyed on Requirements.psd1, which is where the Playwright pin lives, so
      # changing the pin invalidates the browser cache with it.
      - name: Cache Playwright browsers
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('Requirements.psd1') }}

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/powershell/Modules
            ~/Documents/PowerShell/Modules
            ~/Documents/WindowsPowerShell/Modules
          key: ${{ runner.os }}-${{ matrix.powershell }}-psmodules-${{ hashFiles('Requirements.psd1') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.powershell }}-psmodules-

      # Explicit, and before the build rather than inside it. Nothing downloads
      # a browser as a side effect of running a build - TestBrowser fails by
      # name and points here instead.
      - name: Install the browser harness
        if: matrix.browser
        run: ./build.ps1 -Task BootstrapBrowser

      # -Bootstrap installs any missing PowerShell module and then runs the
      # named task, so one invocation is enough. It does not install tools.
      - name: Bootstrap and test
        run: ./build.ps1 -Bootstrap -Task ${{ matrix.browser && '.' || 'WithoutBrowser' }}

      - name: Publish test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.powershell }}
          path: output/*.xml
          if-no-files-found: warn
